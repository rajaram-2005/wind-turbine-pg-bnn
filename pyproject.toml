[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "aerovigil-pg-bnn"
version = "0.1.0"
description = "Physics-Guided Bayesian Neural Network for Wind Turbine RUL Prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Aerovigil AI", email = "contact@aerovigil.ai"},
    {name = "Rajaram", email = "rajaram@aerovigil.ai"}
]
maintainers = [
    {name = "Aerovigil AI", email = "contact@aerovigil.ai"}
]
keywords = [
    "predictive-maintenance",
    "wind-energy",
    "bayesian-neural-network",
    "rul-prediction",
    "physics-informed",
    "scada-telemetry",
    "remaining-useful-life",
    "aerovigil"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
demo = [
    "gradio>=4.0.0",
    "plotly>=5.15.0",
]
all = [
    "aerovigil-pg-bnn[dev,demo]",
]

[project.urls]
Homepage = "https://aerovigil.abacusai.app"
Documentation = "https://huggingface.co/AerovigilAI/wind-turbine-pg-bnn"
Repository = "https://github.com/rajaram-2005/wind-turbine-pg-bnn"
Issues = "https://github.com/rajaram-2005/wind-turbine-pg-bnn/issues"
"Live Demo" = "https://aerovigil.abacusai.app"
"Hugging Face" = "https://huggingface.co/AerovigilAI/wind-turbine-pg-bnn"

[project.scripts]
aerovigil-infer = "aerovigil_pg_bnn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aerovigil_pg_bnn"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/config.json",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src/aerovigil_pg_bnn --cov-report=term-missing"
