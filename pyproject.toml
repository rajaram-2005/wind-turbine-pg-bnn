[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-turbine-pg-bnn"
version = "1.0.0"
description = "AeroVigil — Physics-Guided Bayesian Neural Network for wind-turbine drivetrain remaining-useful-life prediction (advisory/decision-support only)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "OMNI-PREDICT research scaffold" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://aerovigil.abacusai.app"
Documentation = "https://aerovigil.abacusai.app"
Repository = "https://github.com/rajaram-2005/wind-turbine-pg-bnn"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["streamlit>=1.32"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "flake8>=7.0",
]

[project.scripts]
wind-turbine-bnn = "src.cli:main"
twin-status = "src.cli_twin:status_main"
twin-simulate = "src.cli_twin:simulate_main"
twin-prompt = "src.cli_twin:prompt_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
