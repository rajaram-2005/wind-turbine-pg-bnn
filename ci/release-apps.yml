# ─────────────────────────────────────────────────────────────────────────────
# ENABLE ME: GitHub only executes workflows that live in .github/workflows/.
# This file is staged under ci/ so it can be committed without the `workflows`
# token scope. To activate, copy it into place and push:
#
#     mkdir -p .github/workflows
#     cp ci/release-apps.yml .github/workflows/release-apps.yml
#     git add .github/workflows/release-apps.yml
#     git commit -m "Enable native-app release builds"
#     git push
#
# Once active, pushing a version tag (v1.0.0, ...) builds the console for
# Windows / macOS / Linux / Android and attaches the binaries to the release.
# The download site at /download picks the assets up automatically.
# ─────────────────────────────────────────────────────────────────────────────
name: release-apps

# Builds the AeroVigilAI native console for every supported platform and
# publishes the binaries to the GitHub Release for the pushed version tag.
# The download site served at /download links these assets automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            platforms: windows
            artifact: aerovigil-windows-x64.zip
          - os: macos-latest
            target: macos
            platforms: macos
            artifact: aerovigil-macos-universal.zip
          - os: ubuntu-latest
            target: linux
            platforms: linux
            artifact: aerovigil-linux-x64.tar.gz
          - os: ubuntu-latest
            target: android
            platforms: android
            artifact: aerovigil-android.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Generate platform runners
        working-directory: apps/aerovigilai_flutter
        run: |
          flutter create --platforms=${{ matrix.platforms }} --org ai.aerovigil --project-name aerovigilai_flutter .
          flutter pub get

      - name: Build (Windows)
        if: matrix.target == 'windows'
        working-directory: apps/aerovigilai_flutter
        run: flutter build windows --release

      - name: Build (macOS)
        if: matrix.target == 'macos'
        working-directory: apps/aerovigilai_flutter
        run: flutter build macos --release

      - name: Build (Linux)
        if: matrix.target == 'linux'
        working-directory: apps/aerovigilai_flutter
        run: flutter build linux --release

      - name: Build (Android)
        if: matrix.target == 'android'
        working-directory: apps/aerovigilai_flutter
        run: flutter build apk --release

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path apps/aerovigilai_flutter/build/windows/x64/runner/Release/* `
            -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS)
        if: matrix.target == 'macos'
        working-directory: apps/aerovigilai_flutter/build/macos/Build/Products/Release
        run: |
          ditto -c -k --sequesterRsrc --keepParent aerovigilai_flutter.app ../../../../../../${{ matrix.artifact }}

      - name: Package (Linux)
        if: matrix.target == 'linux'
        working-directory: apps/aerovigilai_flutter/build/linux/x64/release
        run: tar -czf ../../../../../${{ matrix.artifact }} bundle

      - name: Package (Android)
        if: matrix.target == 'android'
        working-directory: apps/aerovigilai_flutter/build/app/outputs/flutter-apk
        run: cp app-release.apk ../../../../../${{ matrix.artifact }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          draft: false
          prerelease: false
