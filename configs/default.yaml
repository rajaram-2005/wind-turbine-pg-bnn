# Default configuration for wind-turbine-pg-bnn
# All values are research-grade defaults; replace with site/OEM parameters for deployment.

physics:
  gearbox:
    vibration_limit_mms: 4.5
    temperature_limit_c: 80.0
    rpm_limit_hss: 1800.0
    viscosity_min_cst: 10.0
    viscosity_max_cst: 50.0
  generator:
    temperature_limit_c: 120.0
    rpm_limit: 1800.0

bnn:
  hidden: [64, 64]
  prior_sigma: 1.0
  train:
    lr: 1.0e-3
    num_epochs: 300
    num_samples: 10
    kl_weight: 1.0e-3
    physics_weight: 0.2
    batch_size: 256
  predict_mc_samples: 64

telemetry:
  window_s: 600          # sliding feature window
  window_stride_s: 200
  sample_interval_s: 10  # high-frequency channel sample rate

safety:
  mode: advisory_only    # MUST remain "advisory_only"
  allow_actuation: false # MUST remain false
