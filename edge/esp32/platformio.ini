; AeroVigil ESP32 telemetry node — PlatformIO build
; Flash:  pio run --target upload ; monitor: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
; The sketch uses only Arduino-ESP32 core libraries (WiFi, HTTPClient,
; Preferences), so no external lib_deps are required.
; lib_deps =
;     bblanchon/ArduinoJson@^7.0   ; optional: if you prefer ArduinoJson

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
