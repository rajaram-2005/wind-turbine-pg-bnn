name: PR Automation

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

      - name: Comment with deployment info
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Deployment Preview

            Once this PR is merged to \`main\`, it will trigger:

            | Step | Action |
            |------|--------|
            | 1 | CI tests (lint, test, security) |
            | 2 | Docker image build test |
            | 3 | On tag push: Full release to PyPI + Docker Hub + Hugging Face |

            **To create a release after merge:**
            \`\`\`bash
            git checkout main
            git pull origin main
            git tag v0.1.0  # increment version
            git push origin v0.1.0
            \`\`\`

            This will automatically:
            - 📦 Publish to PyPI
            - 🐳 Push Docker images
            - 🤗 Deploy to Hugging Face Hub
            - 🎨 Update Gradio Space`
            })
