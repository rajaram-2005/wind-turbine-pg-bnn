name: Release to PyPI, Docker Hub & Hugging Face

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Semantic version tags only

permissions:
  contents: write
  id-token: write # For PyPI trusted publishing

jobs:
  # ─── STAGE 1: Verify & Build ───────────────────────────────
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for version checks

      - name: Verify tag matches version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(grep -oP 'version = "\K[^"]+' pyproject.toml)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "❌ Tag $TAG does not match version v$VERSION"
            exit 1
          fi
          echo "✅ Tag matches version: $TAG"

  build:
    name: Build Package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── STAGE 2: Publish to PyPI ──────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aerovigil-pg-bnn

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ─── STAGE 3: Publish Docker Images ────────────────────────
  publish-docker:
    name: Publish Docker Images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wind-turbine-pg-bnn
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            latest

      - name: Build and push CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: gpu
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wind-turbine-pg-bnn:gpu-${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── STAGE 4: Deploy to Hugging Face ───────────────────────
  deploy-huggingface:
    name: Deploy to Hugging Face Hub
    needs: [publish-pypi, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub
        run: pip install huggingface-hub

      - name: Login to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: huggingface-cli login --token $HF_TOKEN

      - name: Create/Update Model Repo
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.create_repo(
              repo_id='AerovigilAI/wind-turbine-pg-bnn',
              exist_ok=True,
              private=False,
              repo_type='model'
          )
          print('✅ Model repo ready')
          "

      - name: Upload model files
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          repo_id = 'AerovigilAI/wind-turbine-pg-bnn'

          files = [
              ('artifacts/bnn_demo.pt', 'bnn_demo.pt'),
              ('config.json', 'config.json'),
              ('README.md', 'README.md'),
              ('model.py', 'model.py'),
          ]

          for local, remote in files:
              api.upload_file(
                  path_or_fileobj=local,
                  path_in_repo=remote,
                  repo_id=repo_id,
              )
              print(f'📤 Uploaded {remote}')

          print('✅ Model deployed to Hugging Face Hub')
          "

      - name: Update model card with release
        run: |
          python -c "
          from huggingface_hub import ModelCard
          import datetime

          repo_id = 'AerovigilAI/wind-turbine-pg-bnn'
          tag = '${{ github.ref_name }}'
          date = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')

          try:
              card = ModelCard.load(repo_id)
              card.content += f'\\n\\n---\\n\\n**Release {tag}** — Deployed on {date} via GitHub Actions 🚀'
              card.push_to_hub(repo_id)
              print(f'✅ Updated model card with {tag}')
          except Exception as e:
              print(f'Note: {e}')
          "

  # ─── STAGE 5: Deploy Gradio Space ────────────────────────
  deploy-space:
    name: Deploy Hugging Face Space
    needs: deploy-huggingface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub
        run: pip install huggingface-hub

      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi, create_repo

          space_repo = 'AerovigilAI/wind-turbine-rul-demo'
          api = HfApi()

          # Create Space if not exists
          try:
              api.create_repo(
                  repo_id=space_repo,
                  repo_type='space',
                  space_sdk='gradio',
                  private=False,
                  exist_ok=True
              )
              print(f'✅ Space created: {space_repo}')
          except Exception as e:
              print(f'Space exists: {e}')

          # Upload Space files
          files = [
              ('gradio_app/app.py', 'app.py'),
              ('gradio_app/requirements.txt', 'requirements.txt'),
              ('config.json', 'config.json'),
          ]

          for local, remote in files:
              api.upload_file(
                  path_or_fileobj=local,
                  path_in_repo=remote,
                  repo_id=space_repo,
                  repo_type='space',
              )
              print(f'📤 Uploaded {remote} to Space')

          print(f'🚀 Space deployed: https://huggingface.co/spaces/{space_repo}')
          "

  # ─── STAGE 6: Create GitHub Release ──────────────────────
  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-docker, deploy-huggingface]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get changes since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" ${{ github.ref_name }})
          else
            CHANGES=$(git log --pretty=format:"- %s" ${LAST_TAG}..${{ github.ref_name }})
          fi

          # Format for GitHub release notes
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 🚀 Aerovigil PG-BNN ${{ github.ref_name }}

            ### What's Changed
            ${{ steps.changelog.outputs.CHANGES }}

            ### 📦 Artifacts
            - **PyPI**: `pip install aerovigil-pg-bnn==${{ github.ref_name }}`
            - **Docker Hub**: `docker pull aerovigilai/wind-turbine-pg-bnn:${{ github.ref_name }}`
            - **Hugging Face**: [AerovigilAI/wind-turbine-pg-bnn](https://huggingface.co/AerovigilAI/wind-turbine-pg-bnn)
            - **Live Demo**: [aerovigil.abacusai.app](https://aerovigil.abacusai.app)

            ### 🧪 Quick Start
            ```bash
            pip install aerovigil-pg-bnn
            aerovigil-infer --input sample.json
            ```
          draft: false
          prerelease: false
