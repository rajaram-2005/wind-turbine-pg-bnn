apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aerovigil-metrics
  namespace: aerovigil
  labels:
    app: aerovigil-api
spec:
  selector:
    matchLabels:
      app: aerovigil-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
