apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerovigil-api
  namespace: aerovigil
  labels:
    app: aerovigil-api
    version: v1
spec:
  # The canonical runtime owns an in-memory twin registry and SQLite WAL
  # stores. Keep exactly one process until those stateful components move to
  # shared external services; scaling pods would split jobs/twins/reports.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aerovigil-api
  template:
    metadata:
      labels:
        app: aerovigil-api
        version: v1
    spec:
      serviceAccountName: aerovigil-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: aerovigilai/wind-turbine-pg-bnn:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aerovigil-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: aerovigil-data
