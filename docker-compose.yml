version: "3.9"

services:
  # Canonical deployment: dashboard and every API share one process, host,
  # health check, artifact mount, and port.
  aerovigil:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: aerovigilai/wind-turbine-pg-bnn:latest
    container_name: aerovigil
    ports:
      - "8000:8000"
    environment:
      - SERVICE_MODE=all
      - PORT=8000
      - LOG_LEVEL=info
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development shell uses exactly the same image and project tree.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: aerovigilai/wind-turbine-pg-bnn:latest
    profiles: ["dev"]
    stdin_open: true
    tty: true
    environment:
      - SERVICE_MODE=cli
    volumes:
      - .:/app
    command: bash

  # Optional GPU variant of the same unified application.
  aerovigil-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu
    image: aerovigilai/wind-turbine-pg-bnn:gpu
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    environment:
      - SERVICE_MODE=all
      - PORT=8000
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./config.json:/app/config.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
